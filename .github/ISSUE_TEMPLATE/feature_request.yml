name: Feature request
description: An idea for something HappyAccess could do.
labels: [ "enhancement" ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. The problem you're trying to solve helps me most, even more than the fix you have in mind.

  - type: dropdown
    id: feature
    attributes:
      label: Which part of HappyAccess?
      options:
        - Temporary access
        - Passwordless login
        - Two-step login
        - New device alerts
        - Admin screen or settings
        - WP-CLI
        - Something new
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
      description: What are you trying to do, and what gets in the way?
      placeholder: When I give a developer access, I need to ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like HappyAccess to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
      description: Another plugin, a code snippet, or a manual step.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you send it
      options:
        - label: I searched the open and closed issues, and nobody has asked for this yet.
          required: true
